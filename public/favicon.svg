<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- The browser tab's icon: src/components/BrandMark.tsx, with the gradient
       stops written out. A favicon is fetched outside the document, so it
       cannot read the CSS variables the in-app mark uses; keep the two in
       step. Drawn a shade larger and heavier than the in-app mark because it
       is read at 16px. -->
  <defs>
    <linearGradient id="brand" x1="1" y1="1" x2="23" y2="23" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4285f4"/>
      <stop offset="0.5" stop-color="#9b72cb"/>
      <stop offset="1" stop-color="#d96570"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="22" height="22" rx="7" fill="url(#brand)"/>
  <path d="M8.4 9 11.7 12 8.4 15" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M13.4 15.2h3.2" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
</svg>
